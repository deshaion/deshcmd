name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag for the draft release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    name: Check draft release
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      signed: ${{ steps.draft.outputs.signed }}
    steps:
      - name: Check release status
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PUBLIC_KEY: ${{ vars.DESHCMD_UPDATE_PUBLIC_KEY }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Expected a version tag, such as v0.1.1." >&2
            exit 1
          fi
          release=$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -- "$RELEASE_TAG")
          jq -e '.isDraft' <<< "$release" >/dev/null || { echo "Release must be a draft." >&2; exit 1; }
          signed=false
          if [[ -n "$UPDATE_PUBLIC_KEY" ]] && jq -e '.isPrerelease | not' <<< "$release" >/dev/null; then
            signed=true
          fi
          printf 'signed=%s\n' "$signed" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Record release commit
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            extension: AppImage
          - platform: Linux
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
          - platform: Windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x86_64
            extension: exe
          - platform: macOS
            runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
            extension: dmg
          - platform: macOS
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            extension: dmg

    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      EXTENSION: ${{ matrix.extension }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      BUILD_STANDALONE: ${{ needs.prepare.outputs.signed }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"

      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config desktop-file-utils

      - name: Read package version
        run: |
          version=$(cargo +stable metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "deshcmd") | .version')
          mkdir -p dist
          printf 'VERSION=%s\nPACKAGE=dist/deshcmd-%s-%s.%s\n' \
            "$version" "$version" "$ARCH" "$EXTENSION" >> "$GITHUB_ENV"

      - name: Build desktop executable
        if: matrix.extension != ''
        run: cargo +stable build --locked --release --package deshcmd --target "$TARGET"

      - name: Package Linux AppImage
        if: matrix.extension == 'AppImage'
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          runtime="$RUNNER_TEMP/runtime-x86_64"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$tool"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            --output "$runtime"
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 "$tool" \
            2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d "$runtime" |
            sha256sum --check
          chmod +x "$tool"

          appdir="$RUNNER_TEMP/DeshCmd.AppDir"
          install -Dm755 "target/$TARGET/release/deshcmd" "$appdir/usr/bin/deshcmd"
          install -Dm644 packaging/linux/deshcmd.desktop "$appdir/deshcmd.desktop"
          install -Dm644 packaging/linux/deshcmd.svg "$appdir/deshcmd.svg"
          install -Dm644 LICENSE "$appdir/usr/share/licenses/deshcmd/LICENSE"
          ln -s usr/bin/deshcmd "$appdir/AppRun"
          desktop-file-validate "$appdir/deshcmd.desktop"
          APPIMAGE_EXTRACT_AND_RUN=1 "$tool" --runtime-file "$runtime" "$appdir" "$PACKAGE"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        run: cp "target/$TARGET/release/deshcmd.exe" "$PACKAGE"

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          staging="$RUNNER_TEMP/deshcmd-dmg"
          app="$staging/DeshCmd.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 755 "target/$TARGET/release/deshcmd" "$app/Contents/MacOS/deshcmd"
          install -m 644 LICENSE "$app/Contents/Resources/LICENSE"
          ln -s /Applications "$staging/Applications"

          # Apple bundle versions use the numeric part of the Cargo version.
          bundle_version="${VERSION%%[-+]*}"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.github.deshaion.deshcmd</string>
            <key>CFBundleName</key><string>DeshCmd</string>
            <key>CFBundleExecutable</key><string>deshcmd</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$bundle_version</string>
            <key>CFBundleVersion</key><string>$bundle_version</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          hdiutil create -volname DeshCmd -srcfolder "$staging" -fs HFS+ -format UDZO "$PACKAGE"
          hdiutil verify "$PACKAGE"

      - name: Upload package
        if: matrix.extension != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE }}
          archive: false
          if-no-files-found: error

      - name: Build and archive standalone executable
        if: env.BUILD_STANDALONE == 'true'
        env:
          DESHCMD_UPDATE_PUBLIC_KEY: ${{ vars.DESHCMD_UPDATE_PUBLIC_KEY }}
        run: |
          cargo +stable build --locked --release --package deshcmd --target "$TARGET" --features standalone-updater
          executable="target/$TARGET/release"
          case "$RUNNER_OS" in
            Linux) asset="dist/deshcmd-linux-$ARCH.tar.gz" ;;
            macOS) asset="dist/deshcmd-macos-$ARCH.tar.gz" ;;
            Windows) asset="dist/deshcmd-windows-$ARCH.zip" ;;
          esac
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd "$executable" && python -m zipfile -c "${GITHUB_WORKSPACE}/$asset" deshcmd.exe)
          else
            if [[ "$RUNNER_OS" == macOS ]]; then
              codesign --force --sign - "$executable/deshcmd"
              codesign --verify --strict "$executable/deshcmd"
            fi
            COPYFILE_DISABLE=1 tar -czf "$asset" -C "$executable" deshcmd
          fi
          printf 'STANDALONE_ASSET=%s\n' "$asset" >> "$GITHUB_ENV"

      - name: Upload standalone archive
        if: env.BUILD_STANDALONE == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.STANDALONE_ASSET }}
          archive: false
          if-no-files-found: error

  attach:
    name: Attach packages and publish release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: deshcmd-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' -- "$RELEASE_TAG")
          [[ "$draft" == true ]] || { echo "Release must still be a draft." >&2; exit 1; }
          shopt -s nullglob
          assets=(dist/deshcmd-*.AppImage dist/deshcmd-*.exe dist/deshcmd-*.dmg)
          if (( ${#assets[@]} != 4 )); then
            echo "Expected four packages, found ${#assets[@]}." >&2
            exit 1
          fi
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" "${assets[@]}" LICENSE

      - name: Sign and upload standalone updates
        if: needs.prepare.outputs.signed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PUBLIC_KEY: ${{ vars.DESHCMD_UPDATE_PUBLIC_KEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.DESHCMD_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "Missing DESHCMD_UPDATE_SIGNING_KEY" >&2; exit 1; }
          umask 077
          signing_key=$(mktemp)
          trap 'rm -f -- "$signing_key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$signing_key"
          unset UPDATE_SIGNING_KEY
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 packaging/sign-update.py dist "$version" "$RELEASE_TAG" "$signing_key" "$UPDATE_PUBLIC_KEY"
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" dist/*.tar.gz dist/*.zip
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" dist/latest.json dist/latest.json.sig

      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE: ${{ needs.prepare.outputs.signed }}
        run: gh release edit --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest="$PROMOTE" -- "$RELEASE_TAG"
